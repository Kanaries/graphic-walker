</style></head><body><main><header><h1>Native worksheet</h1><p>Nested headers and marks share one drawing surface. Scroll, select a mark, or switch between Canvas and SVG.</p><small>Prepared result fixtures. Chart marks, domains and selection share the same Canvas/SVG scene.</small></header><div class="controls"><label>Example <select id="example"><option value="nested">Regional sales · 24 panes</option><option value="line">Lines · ordered series and null gap</option><option value="heatmap">Heatmap · continuous color</option><option value="text">Text · formatted cell values</option><option value="grouped">Bars · grouped series</option><option value="stack">Bars · positive and negative stack</option><option value="scatter">Points · size, shape and opacity</option><option value="deep">Deep headers · eight levels</option><option value="scope">Domains · shared, prefix and pane</option><option value="interval">Bars · prepared intervals</option><option value="controlled">Controlled headers · collapse and sort</option><option value="paged">Paged input · release remaining records</option><option value="preview">Preview · incomplete input</option><option value="huge">Windowed source · 1,000,000 rows</option></select></label><label>Domain scope <select id="scope" disabled><option value="prefix">Region prefix</option><option value="shared">Shared</option><option value="pane">Per pane</option></select></label><label>Renderer <select id="backend"><option value="canvas">Canvas</option><option value="svg">SVG</option></select></label><button id="first">First position</button><button id="last">Last position</button><button id="export">Export viewport SVG</button><button id="export-png">Export viewport PNG</button><button id="release-page" hidden>Release remaining records</button><label><input id="path-labels" type="checkbox"> Path labels</label><button id="export-range">Export first 6 × 4 positions</button><button id="cancel-export" disabled>Cancel export</button></div><p id="description"></p><p id="controlled-status" role="status" aria-live="polite" hidden></p><div id="chart"></div><div id="summary" aria-live="polite">Loading…</div><div id="selection">Select a mark to inspect its prepared values.</div><div id="export-status" role="status"></div><div id="export-files"></div><div id="error" role="alert"></div></main><script type="module" src="./bundle.js"></script></body></html>
