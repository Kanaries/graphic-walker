name: Auto Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  auto-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install deps
        run: yarn install
      - name: npm package build
        run: yarn workspace @kanaries/graphic-walker build
      - name: Vite consumer smoke test
        if: matrix.node-version == '20.x'
        timeout-minutes: 20
        run: yarn test:consumer
      - name: Web app (playground) build
        run: yarn workspace playground build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 22.x
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
      - name: Install deps
        run: yarn install --frozen-lockfile
      - name: Install Playwright browsers
        run: yarn workspace @kanaries/graphic-walker playwright install --with-deps chromium firefox webkit
      - name: Browser regression tests
        run: yarn workspace @kanaries/graphic-walker test:e2e
